<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     version="1.1"
     width="80px"
     height="120px"
     viewBox="0 0 80 120">

  <g>
    <!-- Base block (bottom foundation) -->
    <rect x="30" y="110" width="20" height="10" fill="#000000"/>

    <!-- First vertical segment (above base) -->
    <rect x="35" y="100" width="10" height="10" fill="#000000"/>

    <!-- Lowest level: T-handle valves (left and right) -->
    <!-- Left T-handle valve -->
    <rect x="10" y="100" width="15" height="6" fill="#000000"/>
    <rect x="8" y="98" width="4" height="3" fill="#000000"/>
    <rect x="9" y="97" width="2" height="1" fill="#000000"/>
    
    <!-- Right T-handle valve -->
    <rect x="55" y="100" width="15" height="6" fill="#000000"/>
    <rect x="68" y="98" width="4" height="3" fill="#000000"/>
    <rect x="69" y="97" width="2" height="1" fill="#000000"/>

    <!-- Second vertical segment -->
    <rect x="36" y="90" width="8" height="10" fill="#000000"/>

    <!-- Mid-level horizontal crossbar -->
    <rect x="20" y="88" width="40" height="4" fill="#000000"/>

    <!-- Mid-level circular valves (3-spoke type) -->
    <!-- Center valve on column -->
    <circle cx="40" cy="90" r="6" fill="#000000"/>
    <circle cx="40" cy="90" r="2" fill="#000000"/>
    <!-- Three spokes -->
    <line x1="40" y1="90" x2="40" y2="84" stroke="#000000" stroke-width="1.5"/>
    <line x1="40" y1="90" x2="35" y2="93" stroke="#000000" stroke-width="1.5"/>
    <line x1="40" y1="90" x2="45" y2="93" stroke="#000000" stroke-width="1.5"/>

    <!-- Left end valve -->
    <circle cx="20" cy="90" r="6" fill="#000000"/>
    <circle cx="20" cy="90" r="2" fill="#000000"/>
    <line x1="20" y1="90" x2="20" y2="84" stroke="#000000" stroke-width="1.5"/>
    <line x1="20" y1="90" x2="15" y2="93" stroke="#000000" stroke-width="1.5"/>
    <line x1="20" y1="90" x2="25" y2="93" stroke="#000000" stroke-width="1.5"/>

    <!-- Right end valve -->
    <circle cx="60" cy="90" r="6" fill="#000000"/>
    <circle cx="60" cy="90" r="2" fill="#000000"/>
    <line x1="60" y1="90" x2="60" y2="84" stroke="#000000" stroke-width="1.5"/>
    <line x1="60" y1="90" x2="55" y2="93" stroke="#000000" stroke-width="1.5"/>
    <line x1="60" y1="90" x2="65" y2="93" stroke="#000000" stroke-width="1.5"/>

    <!-- Third vertical segment -->
    <rect x="37" y="75" width="6" height="13" fill="#000000"/>

    <!-- Upper-level horizontal crossbar (shorter) -->
    <rect x="25" y="73" width="30" height="4" fill="#000000"/>

    <!-- Upper-level circular valves (3-spoke type) -->
    <!-- Center valve on column -->
    <circle cx="40" cy="75" r="6" fill="#000000"/>
    <circle cx="40" cy="75" r="2" fill="#000000"/>
    <line x1="40" y1="75" x2="40" y2="69" stroke="#000000" stroke-width="1.5"/>
    <line x1="40" y1="75" x2="35" y2="78" stroke="#000000" stroke-width="1.5"/>
    <line x1="40" y1="75" x2="45" y2="78" stroke="#000000" stroke-width="1.5"/>

    <!-- Left end valve -->
    <circle cx="25" cy="75" r="6" fill="#000000"/>
    <circle cx="25" cy="75" r="2" fill="#000000"/>
    <line x1="25" y1="75" x2="25" y2="69" stroke="#000000" stroke-width="1.5"/>
    <line x1="25" y1="75" x2="20" y2="78" stroke="#000000" stroke-width="1.5"/>
    <line x1="25" y1="75" x2="30" y2="78" stroke="#000000" stroke-width="1.5"/>

    <!-- Right end valve -->
    <circle cx="55" cy="75" r="6" fill="#000000"/>
    <circle cx="55" cy="75" r="2" fill="#000000"/>
    <line x1="55" y1="75" x2="55" y2="69" stroke="#000000" stroke-width="1.5"/>
    <line x1="55" y1="75" x2="50" y2="78" stroke="#000000" stroke-width="1.5"/>
    <line x1="55" y1="75" x2="60" y2="78" stroke="#000000" stroke-width="1.5"/>

    <!-- Fourth vertical segment (narrowest) -->
    <rect x="38" y="50" width="4" height="23" fill="#000000"/>

    <!-- Top cap -->
    <rect x="37" y="45" width="6" height="5" rx="1" fill="#000000"/>

    <!-- Top-level circular valve (single, on column) -->
    <circle cx="40" cy="50" r="6" fill="#000000"/>
    <circle cx="40" cy="50" r="2" fill="#000000"/>
    <line x1="40" y1="50" x2="40" y2="44" stroke="#000000" stroke-width="1.5"/>
    <line x1="40" y1="50" x2="35" y2="53" stroke="#000000" stroke-width="1.5"/>
    <line x1="40" y1="50" x2="45" y2="53" stroke="#000000" stroke-width="1.5"/>

  </g>

</svg>
