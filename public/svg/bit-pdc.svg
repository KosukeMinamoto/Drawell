<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     version="1.1"
     width="80px"
     height="120px"
     viewBox="0 0 80 120">

  <g>
    <!-- PDC (Polycrystalline Diamond Compact) Bit (1980s-2000s) -->
    <!-- Threaded cylindrical top section -->
    <rect x="35" y="0" width="10" height="25" fill="#888888" stroke="#000000" stroke-width="1"/>
    <!-- Thread representation -->
    <line x1="35" y1="5" x2="45" y2="5" stroke="#000000" stroke-width="0.5"/>
    <line x1="35" y1="10" x2="45" y2="10" stroke="#000000" stroke-width="0.5"/>
    <line x1="35" y1="15" x2="45" y2="15" stroke="#000000" stroke-width="0.5"/>
    <line x1="35" y1="20" x2="45" y2="20" stroke="#000000" stroke-width="0.5"/>
    
    <!-- Main solid sculpted body (blade/matrix body) -->
    <ellipse cx="40" cy="45" rx="28" ry="20" fill="#CCCCCC" stroke="#000000" stroke-width="2"/>
    <rect x="12" y="35" width="56" height="20" fill="#CCCCCC"/>
    
    <!-- Flow channels (junk slots) - grooves running down sides -->
    <path d="M 20 35 L 20 55" fill="none" stroke="#000000" stroke-width="1.5"/>
    <path d="M 60 35 L 60 55" fill="none" stroke="#000000" stroke-width="1.5"/>
    
    <!-- PDC cutters (flat circular cutting inserts) embedded in body -->
    <!-- Top row -->
    <circle cx="25" cy="40" r="3" fill="#000000"/>
    <circle cx="40" cy="38" r="3" fill="#000000"/>
    <circle cx="55" cy="40" r="3" fill="#000000"/>
    
    <!-- Middle row -->
    <circle cx="20" cy="45" r="3" fill="#000000"/>
    <circle cx="30" cy="45" r="3" fill="#000000"/>
    <circle cx="50" cy="45" r="3" fill="#000000"/>
    <circle cx="60" cy="45" r="3" fill="#000000"/>
    
    <!-- Lower row -->
    <circle cx="25" cy="50" r="3" fill="#000000"/>
    <circle cx="40" cy="52" r="3" fill="#000000"/>
    <circle cx="55" cy="50" r="3" fill="#000000"/>
    
    <!-- Bottom section with more cutters -->
    <ellipse cx="40" cy="70" rx="25" ry="15" fill="#CCCCCC" stroke="#000000" stroke-width="2"/>
    <rect x="15" y="60" width="50" height="20" fill="#CCCCCC"/>
    
    <!-- More PDC cutters on bottom -->
    <circle cx="22" cy="65" r="3" fill="#000000"/>
    <circle cx="35" cy="63" r="3" fill="#000000"/>
    <circle cx="45" cy="63" r="3" fill="#000000"/>
    <circle cx="58" cy="65" r="3" fill="#000000"/>
    <circle cx="30" cy="70" r="3" fill="#000000"/>
    <circle cx="50" cy="70" r="3" fill="#000000"/>
    <circle cx="40" cy="75" r="3" fill="#000000"/>
    
    <!-- Additional flow channels -->
    <path d="M 18 60 L 18 80" fill="none" stroke="#000000" stroke-width="1.5"/>
    <path d="M 62 60 L 62 80" fill="none" stroke="#000000" stroke-width="1.5"/>
  </g>

</svg>
