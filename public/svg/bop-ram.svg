<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     version="1.1"
     width="160px"
     height="140px"
     viewBox="0 0 160 140">

  <g>
    <!-- Double (Combi) Ram - Blind Shear Ram (upper) + Variable Bore Ram (lower) -->
    
    <!-- Blind Shear Ram (upper) - dark red, rectangular/box-shaped -->
    <!-- Main body (dark red) -->
    <rect x="50" y="10" width="60" height="50" rx="3" fill="#8B0000" stroke="#000000" stroke-width="2"/>
    
    <!-- Horizontal extensions (left and right) with metallic end caps -->
    <!-- Left extension -->
    <rect x="20" y="25" width="30" height="20" fill="#8B0000" stroke="#000000" stroke-width="2"/>
    <rect x="15" y="28" width="5" height="14" rx="2" fill="#C0C0C0" stroke="#000000" stroke-width="1"/>
    <!-- Bolt pattern on end cap -->
    <circle cx="17.5" cy="32" r="1" fill="#000000"/>
    <circle cx="17.5" cy="38" r="1" fill="#000000"/>
    
    <!-- Right extension -->
    <rect x="110" y="25" width="30" height="20" fill="#8B0000" stroke="#000000" stroke-width="2"/>
    <rect x="140" y="28" width="5" height="14" rx="2" fill="#C0C0C0" stroke="#000000" stroke-width="1"/>
    <circle cx="142.5" cy="32" r="1" fill="#000000"/>
    <circle cx="142.5" cy="38" r="1" fill="#000000"/>
    
    <!-- Circular light blue element with darker blue center (front face) -->
    <circle cx="80" cy="35" r="12" fill="#87CEEB" stroke="#000000" stroke-width="1"/>
    <circle cx="80" cy="35" r="6" fill="#4682B4"/>
    
    <!-- Top and bottom flanges -->
    <rect x="45" y="5" width="70" height="5" fill="#555555" stroke="#000000" stroke-width="1"/>
    <rect x="45" y="60" width="70" height="5" fill="#555555" stroke="#000000" stroke-width="1"/>
    
    <!-- Variable Bore Ram (lower) - dark red, similar structure -->
    <!-- Main body (dark red) -->
    <rect x="50" y="70" width="60" height="50" rx="3" fill="#8B0000" stroke="#000000" stroke-width="2"/>
    
    <!-- Horizontal extensions (left and right) -->
    <!-- Left extension -->
    <rect x="20" y="85" width="30" height="20" fill="#8B0000" stroke="#000000" stroke-width="2"/>
    <rect x="15" y="88" width="5" height="14" rx="2" fill="#C0C0C0" stroke="#000000" stroke-width="1"/>
    <circle cx="17.5" cy="92" r="1" fill="#000000"/>
    <circle cx="17.5" cy="98" r="1" fill="#000000"/>
    
    <!-- Right extension -->
    <rect x="110" y="85" width="30" height="20" fill="#8B0000" stroke="#000000" stroke-width="2"/>
    <rect x="140" y="88" width="5" height="14" rx="2" fill="#C0C0C0" stroke="#000000" stroke-width="1"/>
    <circle cx="142.5" cy="92" r="1" fill="#000000"/>
    <circle cx="142.5" cy="98" r="1" fill="#000000"/>
    
    <!-- Circular light blue element with darker blue center (front face) -->
    <circle cx="80" cy="95" r="12" fill="#87CEEB" stroke="#000000" stroke-width="1"/>
    <circle cx="80" cy="95" r="6" fill="#4682B4"/>
    
    <!-- Bottom flange -->
    <rect x="45" y="120" width="70" height="5" fill="#555555" stroke="#000000" stroke-width="1"/>
    
    <!-- Central vertical pipe (through center) -->
    <rect x="77" y="0" width="6" height="140" fill="#888888" stroke="#000000" stroke-width="1"/>
  </g>

</svg>
