<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     version="1.1"
     width="80px"
     height="120px"
     viewBox="0 0 80 120">

  <g>
    <!-- Two-Cone Roller Bit (1909) by Howard Hughes Sr. -->
    <!-- Threaded top connection -->
    <rect x="35" y="0" width="10" height="25" fill="#888888" stroke="#000000" stroke-width="1"/>
    <!-- Thread representation -->
    <line x1="35" y1="5" x2="45" y2="5" stroke="#000000" stroke-width="0.5"/>
    <line x1="35" y1="10" x2="45" y2="10" stroke="#000000" stroke-width="0.5"/>
    <line x1="35" y1="15" x2="45" y2="15" stroke="#000000" stroke-width="0.5"/>
    <line x1="35" y1="20" x2="45" y2="20" stroke="#000000" stroke-width="0.5"/>
    
    <!-- Blocky/hexagonal main body -->
    <rect x="30" y="25" width="20" height="25" rx="2" fill="#CCCCCC" stroke="#000000" stroke-width="2"/>
    <!-- Hexagonal shape hint -->
    <path d="M 30 25 L 35 25 L 40 30 L 45 30 L 50 25 L 50 35 L 45 40 L 35 40 L 30 35 Z" 
          fill="#CCCCCC" 
          stroke="#000000" 
          stroke-width="1"/>
    
    <!-- Triangular recess/vent on side -->
    <path d="M 50 30 L 55 35 L 50 40 Z" fill="#AAAAAA" stroke="#000000" stroke-width="1"/>
    
    <!-- Two large conical rollers (angled downwards and slightly inwards) -->
    <!-- Left cone -->
    <ellipse cx="25" cy="75" rx="12" ry="20" fill="#999999" stroke="#000000" stroke-width="1.5"/>
    <path d="M 13 75 L 25 55 L 37 75 Z" fill="#999999" stroke="#000000" stroke-width="1.5"/>
    <!-- Circular teeth/protrusions on roller -->
    <circle cx="25" cy="65" r="2" fill="#000000"/>
    <circle cx="25" cy="70" r="2.5" fill="#000000"/>
    <circle cx="25" cy="75" r="3" fill="#000000"/>
    <circle cx="25" cy="80" r="2.5" fill="#000000"/>
    <circle cx="25" cy="85" r="2" fill="#000000"/>
    <circle cx="20" cy="75" r="2" fill="#000000"/>
    <circle cx="30" cy="75" r="2" fill="#000000"/>
    
    <!-- Right cone -->
    <ellipse cx="55" cy="75" rx="12" ry="20" fill="#999999" stroke="#000000" stroke-width="1.5"/>
    <path d="M 43 75 L 55 55 L 67 75 Z" fill="#999999" stroke="#000000" stroke-width="1.5"/>
    <!-- Circular teeth/protrusions on roller -->
    <circle cx="55" cy="65" r="2" fill="#000000"/>
    <circle cx="55" cy="70" r="2.5" fill="#000000"/>
    <circle cx="55" cy="75" r="3" fill="#000000"/>
    <circle cx="55" cy="80" r="2.5" fill="#000000"/>
    <circle cx="55" cy="85" r="2" fill="#000000"/>
    <circle cx="50" cy="75" r="2" fill="#000000"/>
    <circle cx="60" cy="75" r="2" fill="#000000"/>
    
    <!-- Central flat face between cones -->
    <ellipse cx="40" cy="70" rx="8" ry="5" fill="#AAAAAA" stroke="#000000" stroke-width="1"/>
  </g>

</svg>
