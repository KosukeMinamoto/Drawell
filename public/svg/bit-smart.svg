<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     version="1.1"
     width="100px"
     height="140px"
     viewBox="0 0 100 140">

  <g>
    <!-- Smart Bit (Modern) with Sensors and Adaptive Cutting Structures -->
    <!-- Threaded top connection -->
    <rect x="45" y="0" width="10" height="25" fill="#888888" stroke="#000000" stroke-width="1"/>
    <!-- Thread representation -->
    <line x1="45" y1="5" x2="55" y2="5" stroke="#000000" stroke-width="0.5"/>
    <line x1="45" y1="10" x2="55" y2="10" stroke="#000000" stroke-width="0.5"/>
    <line x1="45" y1="15" x2="55" y2="15" stroke="#000000" stroke-width="0.5"/>
    <line x1="45" y1="20" x2="55" y2="20" stroke="#000000" stroke-width="0.5"/>
    
    <!-- Main body (complex, angular, multi-bladed structure) -->
    <rect x="40" y="25" width="20" height="30" rx="3" fill="#CCCCCC" stroke="#000000" stroke-width="2"/>
    
    <!-- Multi-bladed/lobed cutting structure -->
    <!-- Blade 1 (left) -->
    <path d="M 40 55 L 30 70 L 25 100 L 35 110 L 40 105 Z" 
          fill="#AAAAAA" 
          stroke="#000000" 
          stroke-width="1.5"/>
    <!-- Serrated/ribbed cutting elements on blade -->
    <line x1="32" y1="75" x2="28" y2="80" stroke="#000000" stroke-width="1"/>
    <line x1="32" y1="85" x2="28" y2="90" stroke="#000000" stroke-width="1"/>
    <line x1="32" y1="95" x2="28" y2="100" stroke="#000000" stroke-width="1"/>
    
    <!-- Blade 2 (center-left) -->
    <path d="M 45 55 L 40 70 L 38 100 L 45 110 L 50 105 Z" 
          fill="#AAAAAA" 
          stroke="#000000" 
          stroke-width="1.5"/>
    <line x1="42" y1="75" x2="40" y2="80" stroke="#000000" stroke-width="1"/>
    <line x1="42" y1="85" x2="40" y2="90" stroke="#000000" stroke-width="1"/>
    <line x1="42" y1="95" x2="40" y2="100" stroke="#000000" stroke-width="1"/>
    
    <!-- Blade 3 (center-right) -->
    <path d="M 55 55 L 60 70 L 62 100 L 55 110 L 50 105 Z" 
          fill="#AAAAAA" 
          stroke="#000000" 
          stroke-width="1.5"/>
    <line x1="58" y1="75" x2="60" y2="80" stroke="#000000" stroke-width="1"/>
    <line x1="58" y1="85" x2="60" y2="90" stroke="#000000" stroke-width="1"/>
    <line x1="58" y1="95" x2="60" y2="100" stroke="#000000" stroke-width="1"/>
    
    <!-- Blade 4 (right) -->
    <path d="M 60 55 L 70 70 L 75 100 L 65 110 L 60 105 Z" 
          fill="#AAAAAA" 
          stroke="#000000" 
          stroke-width="1.5"/>
    <line x1="68" y1="75" x2="72" y2="80" stroke="#000000" stroke-width="1"/>
    <line x1="68" y1="85" x2="72" y2="90" stroke="#000000" stroke-width="1"/>
    <line x1="68" y1="95" x2="72" y2="100" stroke="#000000" stroke-width="1"/>
    
    <!-- Internal passages for fluid (hints) -->
    <circle cx="50" cy="70" r="3" fill="none" stroke="#000000" stroke-width="0.5" stroke-dasharray="1,1"/>
    
    <!-- Technology icons above bit -->
    <!-- Microchip symbol with wavy lines (wireless communication/sensors) -->
    <rect x="65" y="10" width="12" height="10" fill="#4A90E2" stroke="#000000" stroke-width="1"/>
    <line x1="67" y1="12" x2="75" y2="12" stroke="#000000" stroke-width="0.5"/>
    <line x1="67" y1="15" x2="75" y2="15" stroke="#000000" stroke-width="0.5"/>
    <line x1="67" y1="18" x2="75" y2="18" stroke="#000000" stroke-width="0.5"/>
    <!-- Wavy lines above (wireless signal) -->
    <path d="M 71 5 Q 73 3, 71 1 Q 69 3, 71 5" fill="none" stroke="#000000" stroke-width="1"/>
    <path d="M 71 7 Q 73 5, 71 3 Q 69 5, 71 7" fill="none" stroke="#000000" stroke-width="1"/>
    
    <!-- Antenna-like structure -->
    <line x1="85" y1="15" x2="85" y2="5" stroke="#000000" stroke-width="1.5"/>
    <line x1="82" y1="8" x2="88" y2="8" stroke="#000000" stroke-width="1.5"/>
    <circle cx="85" cy="5" r="2" fill="#4A90E2" stroke="#000000" stroke-width="1"/>
  </g>

</svg>
