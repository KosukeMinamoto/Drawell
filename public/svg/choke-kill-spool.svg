<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     version="1.1"
     width="140px"
     height="80px"
     viewBox="0 0 140 80">

  <g>
    <!-- Choke and Kill Spool - purplish/dark pink -->
    <!-- Main square/block-like body (purplish/dark pink) -->
    <rect x="50" y="20" width="40" height="40" rx="3" fill="#C71585" stroke="#000000" stroke-width="2"/>
    
    <!-- Shorter horizontal extensions (left and right) -->
    <!-- Left extension -->
    <rect x="30" y="32" width="20" height="16" fill="#C71585" stroke="#000000" stroke-width="2"/>
    <rect x="25" y="35" width="5" height="10" rx="2" fill="#C0C0C0" stroke="#000000" stroke-width="1"/>
    
    <!-- Right extension -->
    <rect x="90" y="32" width="20" height="16" fill="#C71585" stroke="#000000" stroke-width="2"/>
    <rect x="110" y="35" width="5" height="10" rx="2" fill="#C0C0C0" stroke="#000000" stroke-width="1"/>
    
    <!-- Circular light blue element with darker blue center (front face) -->
    <circle cx="70" cy="40" r="10" fill="#87CEEB" stroke="#000000" stroke-width="1"/>
    <circle cx="70" cy="40" r="5" fill="#4682B4"/>
    
    <!-- Top and bottom connection flanges -->
    <rect x="45" y="15" width="50" height="5" fill="#555555" stroke="#000000" stroke-width="1"/>
    <rect x="45" y="60" width="50" height="5" fill="#555555" stroke="#000000" stroke-width="1"/>
    
    <!-- Central vertical pipe (through center) -->
    <rect x="67" y="0" width="6" height="80" fill="#888888" stroke="#000000" stroke-width="1"/>
  </g>

</svg>
