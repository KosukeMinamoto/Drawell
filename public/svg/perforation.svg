<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN"
  "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd">
<svg xmlns="http://www.w3.org/2000/svg"
     version="1.1"
     width="81px"
     height="200px"
     viewBox="0 0 81 200">

  <defs>
    <!-- single perforation triangle -->
    <symbol id="perforation-triangle" viewBox="0 0 80 40">
      <path d="M 0 0 L 80 20 L 0 40 Z"
            fill="none"
            stroke="#000000"
            stroke-miterlimit="10"/>
    </symbol>
  </defs>

  <!-- n = 5 -->
  <use href="#perforation-triangle" x="0" y="0"/>
  <use href="#perforation-triangle" x="0" y="40"/>
  <use href="#perforation-triangle" x="0" y="80"/>
  <use href="#perforation-triangle" x="0" y="120"/>
  <use href="#perforation-triangle" x="0" y="160"/>

</svg>
