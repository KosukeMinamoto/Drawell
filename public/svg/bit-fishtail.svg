<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     version="1.1"
     width="60px"
     height="120px"
     viewBox="0 0 60 120">

  <g>
    <!-- Fishtail Bit (1800s) -->
    <!-- Smooth cylindrical top section (tapering down) -->
    <rect x="25" y="0" width="10" height="40" fill="#888888" stroke="#000000" stroke-width="1"/>
    <ellipse cx="30" cy="40" rx="5" ry="3" fill="#888888" stroke="#000000" stroke-width="1"/>
    
    <!-- Broad, flat, spade-like cutting head -->
    <!-- Two curved, wing-like blades (fish tail shape) -->
    <path d="M 30 40 L 15 60 L 10 100 L 20 110 L 30 105 Z" 
          fill="#CCCCCC" 
          stroke="#000000" 
          stroke-width="2"/>
    <path d="M 30 40 L 45 60 L 50 100 L 40 110 L 30 105 Z" 
          fill="#CCCCCC" 
          stroke="#000000" 
          stroke-width="2"/>
    
    <!-- Sharp edges at bottom -->
    <line x1="20" y1="110" x2="30" y2="105" stroke="#000000" stroke-width="2"/>
    <line x1="40" y1="110" x2="30" y2="105" stroke="#000000" stroke-width="2"/>
    
    <!-- Central connection point -->
    <line x1="30" y1="105" x2="30" y2="120" stroke="#000000" stroke-width="1"/>
  </g>

</svg>
