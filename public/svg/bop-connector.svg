<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     version="1.1"
     width="80px"
     height="40px"
     viewBox="0 0 80 40">

  <g>
    <!-- BOP Connector (Spacer) - light blue/teal cylindrical -->
    <!-- Main cylindrical body (light blue/teal) -->
    <rect x="30" y="10" width="20" height="20" rx="5" fill="#4ECDC4" stroke="#000000" stroke-width="2"/>
    
    <!-- Top flange (light brown/tan) -->
    <rect x="25" y="5" width="30" height="5" fill="#D2B48C" stroke="#000000" stroke-width="1"/>
    <circle cx="28" cy="7.5" r="1.5" fill="#000000"/>
    <circle cx="40" cy="7.5" r="1.5" fill="#000000"/>
    <circle cx="52" cy="7.5" r="1.5" fill="#000000"/>
    
    <!-- Bottom flange (light brown/tan) -->
    <rect x="25" y="30" width="30" height="5" fill="#D2B48C" stroke="#000000" stroke-width="1"/>
    <circle cx="28" cy="32.5" r="1.5" fill="#000000"/>
    <circle cx="40" cy="32.5" r="1.5" fill="#000000"/>
    <circle cx="52" cy="32.5" r="1.5" fill="#000000"/>
    
    <!-- Central vertical pipe (through center) -->
    <rect x="37" y="0" width="6" height="40" fill="#888888" stroke="#000000" stroke-width="1"/>
  </g>

</svg>
