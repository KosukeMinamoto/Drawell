<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN" "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd">
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     version="1.1"
     width="43px"
     height="243px"
     viewBox="0 0 43 243">

  <defs>
    <pattern id="mx-pattern-dots"
             patternUnits="userSpaceOnUse"
             width="12"
             height="12">
      <circle cx="6" cy="6" r="3" fill="#000000"/>
    </pattern>
  </defs>

  <g>
    <!-- vertical line -->
    <path d="M 0 201 L 0 1"
          fill="none"
          stroke="#000000"
          stroke-width="2"
          stroke-miterlimit="10"/>

    <!-- triangle -->
    <path d="M 0 241 L 0 201 L 40 241 Z"
          fill="url(#mx-pattern-dots)"
          stroke="#23445d"
          stroke-width="2"
          stroke-miterlimit="10"/>
  </g>

</svg>
