<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="120" height="80" viewBox="0 0 120 80">
  <!-- Drilling Spool: 縦長円筒＋左右に小さなノズル（フランジ付き） -->
  <!-- 中央円筒本体（Ram BOPより細い） -->
  <rect x="48" y="15" width="24" height="50" rx="4" fill="#00008B" stroke="#000" stroke-width="2"/>
  <!-- 左側ノズル（小さい円筒＋フランジ） -->
  <rect x="18" y="32" width="32" height="16" rx="3" fill="#00008B" stroke="#000" stroke-width="2"/>
  <rect x="12" y="36" width="6" height="8" fill="#555" stroke="#000" stroke-width="1"/>
  <!-- 右側ノズル -->
  <rect x="70" y="32" width="32" height="16" rx="3" fill="#00008B" stroke="#000" stroke-width="2"/>
  <rect x="102" y="36" width="6" height="8" fill="#555" stroke="#000" stroke-width="1"/>
  <!-- 上面・下面フランジ -->
  <rect x="44" y="10" width="32" height="5" fill="#555" stroke="#000" stroke-width="1"/>
  <rect x="44" y="65" width="32" height="5" fill="#555" stroke="#000" stroke-width="1"/>
  <!-- 中心パイプ -->
  <rect x="57" y="0" width="6" height="80" fill="#888" stroke="#000" stroke-width="1"/>
</svg>
