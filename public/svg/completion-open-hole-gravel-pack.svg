<?xml version="1.0" encoding="UTF-8"?>
<!-- Well completion: Open hole gravel-pack – 仕上げ部分のみ -->
<svg xmlns="http://www.w3.org/2000/svg"
     version="1.1"
     width="80px"
     height="120px"
     viewBox="0 0 80 120">

  <defs>
    <pattern id="ohgp-gravel" patternUnits="userSpaceOnUse" width="6" height="6">
      <circle cx="1" cy="1" r="0.8" fill="#7a6b5a"/>
      <circle cx="4" cy="2" r="0.8" fill="#7a6b5a"/>
      <circle cx="2" cy="4" r="0.8" fill="#7a6b5a"/>
      <circle cx="5" cy="5" r="0.8" fill="#7a6b5a"/>
    </pattern>
  </defs>

  <g>
    <!-- Wellbore line + casing shoe -->
    <line x1="40" y1="0" x2="40" y2="18" stroke="#333" stroke-width="1.5"/>
    <path d="M 40 18 L 36 26 L 44 26 Z" fill="#333" stroke="#333" stroke-width="1"/>
    <!-- Borehole wall (irregular open hole) -->
    <path d="M 15 0 L 12 35 L 10 70 L 14 105 L 18 120 L 62 120 L 66 105 L 70 70 L 68 35 L 65 0 Z"
          fill="none"
          stroke="#8B7355"
          stroke-width="1.5"/>
    <!-- グラベルパック（環状空間＝外縁とライナーの間） -->
    <path d="M 15 0 L 12 35 L 10 70 L 14 105 L 18 120 L 62 120 L 66 105 L 70 70 L 68 35 L 65 0 Z M 38 5 L 38 115 L 42 115 L 42 5 Z"
          fill="url(#ohgp-gravel)"
          opacity="0.8"
          stroke="none"
          fill-rule="evenodd"/>
    <!-- スロッテッドライナー（縦破線） -->
    <line x1="38" y1="0" x2="38" y2="120" stroke="#666" stroke-width="1.5" stroke-dasharray="4 3"/>
    <line x1="42" y1="0" x2="42" y2="120" stroke="#666" stroke-width="1.5" stroke-dasharray="4 3"/>
    <!-- スロット表現（短い縦線） -->
    <line x1="39" y1="15" x2="39" y2="22" stroke="#444" stroke-width="1"/>
    <line x1="41" y1="40" x2="41" y2="47" stroke="#444" stroke-width="1"/>
    <line x1="39" y1="65" x2="39" y2="72" stroke="#444" stroke-width="1"/>
    <line x1="41" y1="90" x2="41" y2="97" stroke="#444" stroke-width="1"/>
    <!-- ライナーハンガー（上端の厚みリング） -->
    <rect x="35" y="0" width="10" height="6" fill="#555" stroke="#333" stroke-width="1"/>
  </g>
</svg>
