<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     version="1.1"
     width="140px"
     height="100px"
     viewBox="0 0 140 100">

  <g>
    <!-- BOP DE RAMS (single) - 3.25 ft or 2.25 ft -->
    <!-- Main elongated rectangular-cylindrical body (red) -->
    <rect x="45" y="10" width="50" height="80" rx="5" fill="#CC0000" stroke="#000000" stroke-width="2"/>
    
    <!-- Top flange (bolted connection) -->
    <rect x="40" y="5" width="60" height="5" fill="#666666" stroke="#000000" stroke-width="1"/>
    <circle cx="45" cy="7.5" r="1.5" fill="#000000"/>
    <circle cx="60" cy="7.5" r="1.5" fill="#000000"/>
    <circle cx="75" cy="7.5" r="1.5" fill="#000000"/>
    <circle cx="90" cy="7.5" r="1.5" fill="#000000"/>
    <circle cx="95" cy="7.5" r="1.5" fill="#000000"/>
    
    <!-- Bottom flange (bolted connection) -->
    <rect x="40" y="90" width="60" height="5" fill="#666666" stroke="#000000" stroke-width="1"/>
    <circle cx="45" cy="92.5" r="1.5" fill="#000000"/>
    <circle cx="60" cy="92.5" r="1.5" fill="#000000"/>
    <circle cx="75" cy="92.5" r="1.5" fill="#000000"/>
    <circle cx="90" cy="92.5" r="1.5" fill="#000000"/>
    <circle cx="95" cy="92.5" r="1.5" fill="#000000"/>
    
    <!-- Two sets of ram units (two on each side) -->
    <!-- Left side - upper ram -->
    <rect x="20" y="30" width="25" height="20" rx="3" fill="#AA0000" stroke="#000000" stroke-width="2"/>
    <circle cx="20" cy="40" r="8" fill="#880000" stroke="#000000" stroke-width="2"/>
    <circle cx="20" cy="40" r="5" fill="#CC0000"/>
    
    <!-- Left side - lower ram -->
    <rect x="20" y="55" width="25" height="20" rx="3" fill="#AA0000" stroke="#000000" stroke-width="2"/>
    <circle cx="20" cy="65" r="8" fill="#880000" stroke="#000000" stroke-width="2"/>
    <circle cx="20" cy="65" r="5" fill="#CC0000"/>
    
    <!-- Right side - upper ram -->
    <rect x="95" y="30" width="25" height="20" rx="3" fill="#AA0000" stroke="#000000" stroke-width="2"/>
    <circle cx="120" cy="40" r="8" fill="#880000" stroke="#000000" stroke-width="2"/>
    <circle cx="120" cy="40" r="5" fill="#CC0000"/>
    
    <!-- Right side - lower ram -->
    <rect x="95" y="55" width="25" height="20" rx="3" fill="#AA0000" stroke="#000000" stroke-width="2"/>
    <circle cx="120" cy="65" r="8" fill="#880000" stroke="#000000" stroke-width="2"/>
    <circle cx="120" cy="65" r="5" fill="#CC0000"/>
    
    <!-- Central vertical pipe (through center) -->
    <rect x="67" y="0" width="6" height="100" fill="#888888" stroke="#000000" stroke-width="1"/>
  </g>

</svg>
