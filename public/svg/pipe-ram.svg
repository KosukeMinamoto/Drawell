<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="160" height="100" viewBox="0 0 160 100">
  <!-- Ram BOP: 中央円筒＋左右に大きなアーム（ダンベル／十字形） -->
  <!-- 中央円筒本体 -->
  <rect x="65" y="25" width="30" height="50" rx="4" fill="#8B0000" stroke="#000" stroke-width="2"/>
  <!-- 左側の大きなアーム（ラム機構） -->
  <rect x="15" y="35" width="50" height="30" fill="#8B0000" stroke="#000" stroke-width="2"/>
  <rect x="8" y="38" width="8" height="24" rx="2" fill="#555" stroke="#000" stroke-width="1"/>
  <!-- 右側の大きなアーム -->
  <rect x="95" y="35" width="50" height="30" fill="#8B0000" stroke="#000" stroke-width="2"/>
  <rect x="144" y="38" width="8" height="24" rx="2" fill="#555" stroke="#000" stroke-width="1"/>
  <!-- 上面・下面フランジ -->
  <rect x="60" y="20" width="40" height="5" fill="#555" stroke="#000" stroke-width="1"/>
  <rect x="60" y="75" width="40" height="5" fill="#555" stroke="#000" stroke-width="1"/>
  <!-- 中心パイプ -->
  <rect x="77" y="0" width="6" height="100" fill="#888" stroke="#000" stroke-width="1"/>
</svg>
