<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="100" height="100" viewBox="0 0 100 100">
  <!-- RBOP (Rotating BOP):  squat barrel, flat top/bottom, two thin discs at top -->
  <!-- 上部の薄いディスク（2枚） -->
  <rect x="42" y="5" width="16" height="4" fill="#666" stroke="#000" stroke-width="1"/>
  <rect x="40" y="12" width="20" height="4" fill="#666" stroke="#000" stroke-width="1"/>
  <!-- 中央の樽型本体（やや幅広） -->
  <rect x="35" y="20" width="30" height="55" rx="8" fill="#CC0000" stroke="#000" stroke-width="2"/>
  <!-- 上部・下部フランジ -->
  <rect x="32" y="16" width="36" height="5" fill="#555" stroke="#000" stroke-width="1"/>
  <rect x="32" y="79" width="36" height="5" fill="#555" stroke="#000" stroke-width="1"/>
  <!-- 中心パイプ -->
  <rect x="47" y="0" width="6" height="100" fill="#888" stroke="#000" stroke-width="1"/>
</svg>
